name: Stage one new preparation example on TEST

on:
  push:
    branches: [codex/material-preparation-demo-test]
    paths:
      - .github/workflows/new-preparation-recording.yml
      - .github/verification/prepare_new_recording_order.py

permissions:
  contents: read

jobs:
  fresh-recording:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Stage one pending material preparation request on TEST
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/material_test
          ssh-keyscan -T 10 -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes -i ~/.ssh/material_test -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            'set -e; container=$(sudo -n docker ps --filter "label=com.docker.swarm.service.name=autochapeau_staging_odoo_odoo" --format "{{.ID}}" | head -1); test -n "$container"; sudo -n docker exec -i "$container" odoo shell -d autochapeau_prod_test --no-http --max-cron-threads=0' \
            < .github/verification/prepare_new_recording_order.py | tee result.log
          grep -q '^TEST_NEW_PREP_RECORDING_ORDER=' result.log
