name: Inspect restricted TEST transfer connection
on:
  push:
    branches: [main]
    paths: [.github/workflows/test-transfer-diagnostic.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read restricted transfer eligibility only
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" sudo -n python3 - <<'PY'
          import json,shutil,re,subprocess,tempfile,base64,gzip
          from pathlib import Path
          root=Path('/var/lib/docker/volumes/autochapeau_staging_odoo_odoo-data/_data/test-refresh-backups/production-copy-44512412979')
          files=list((root/'incoming').rglob('*'))
          regular=[p for p in files if p.is_file()]
          result={'received_complete':(root/'received.json').exists(),'candidate_verified':(root/'candidate-verified.json').exists(),'completed':(root/'completed.json').exists(),'received_file_count':len(regular),'received_bytes':sum(p.stat().st_size for p in regular),'free_bytes':shutil.disk_usage(root).free,'stage_logs':{p.name:p.stat().st_size for p in root.glob('*.log')}}
          print('TEST_REFRESH_PROGRESS='+json.dumps(result,sort_keys=True))
          for filename in ('candidate-prepare.private.log','restore.private.log','native-neutralize.private.log','upgrade.private.log','verify_staging.py.private.log','run_regression.py.private.log','run_mobile_unique_tests.py.private.log'):
              path=root/filename
              if not path.exists():continue
              selected=[]
              for line in path.read_text(errors='replace').splitlines()[-150:]:
                  text=line.strip()
                  if text.startswith(('Traceback','File ','AssertionError','ValueError','KeyError','TypeError','FileNotFoundError','RuntimeError','odoo.tools.convert.ParseError','Error while validating view','Field ' ,'psycopg2.')) or ('psql:' in line and 'ERROR:' in line):
                      if text.startswith('Field '):print('STATIC_VIEW_FIELD_NAMES='+json.dumps(re.findall(r'["\x27]([a-zA-Z0-9_.]+)["\x27]',text)))
                      text=re.sub(r"(['\"])(.*?)\1",'<redacted>',text)
                      text=re.sub(r'[A-Za-z0-9_.+-]+@[A-Za-z0-9.-]+','<redacted>',text)
                      selected.append(text[:600])
              if selected:print('TEST_REFRESH_ERROR_CONTEXT='+json.dumps({'log':filename,'lines':selected[-14:]}))

          workers=subprocess.check_output(['docker','ps','--filter','label=com.docker.swarm.service.name=test-refresh-worker-44512412979','--format','{{.ID}}'],text=True).split()
          assert len(workers)==1
          stop=r"""
          import os,signal
          from pathlib import Path
          matched=[]
          for proc in Path('/proc').iterdir():
              if not proc.name.isdigit():continue
              try:args=[x.decode() for x in (proc/'cmdline').read_bytes().split(b'\0') if x]
              except (FileNotFoundError,ProcessLookupError):continue
              if len(args)>4 and args[0].endswith('python3') and args[1]=='/opt/test-refresh-tools/test_refresh_odoo.py' and args[2]=='shell' and 'test_refresh_candidate_44512412979' in args:
                  os.kill(int(proc.name),signal.SIGTERM);matched.append(int(proc.name))
          assert len(matched)==1
          print('ISOLATED_TEST_CLI_STOPPED=1')
          """
          subprocess.run(['docker','exec',workers[0],'python3','-c',stop],check=True)
          ids=subprocess.check_output(['docker','ps','--filter','label=com.docker.swarm.service.name=autochapeau_staging_odoo_odoo','--format','{{.ID}}'],text=True).split();assert len(ids)==1
          code="""
          import json,psycopg2
          from odoo.tools import config
          config.parse_config([])
          options={k:config['db_'+k] for k in ('host','port','user','password') if config['db_'+k]}
          with psycopg2.connect(dbname='postgres',**options) as conn:
              conn.set_session(readonly=True)
              with conn.cursor() as cr:
                  cr.execute("SELECT pid,state,wait_event_type,wait_event,pg_blocking_pids(pid),left(query,2000),extract(epoch from now()-query_start)::int FROM pg_stat_activity WHERE datname='test_refresh_candidate_44512412979'")
                  rows=cr.fetchall()
                  from pathlib import Path
                  Path('/var/lib/odoo/test-refresh-backups/production-copy-44512412979/activity.private.json').write_text(json.dumps(rows,default=str))
                  print('CANDIDATE_DATABASE_ACTIVITY='+json.dumps([{'pid':r[0],'state':r[1],'wait_type':r[2],'wait':r[3],'blockers':r[4],'sql_operation':r[5].split()[0] if r[5].split() else '', 'seconds':r[6]} for r in rows]))
          """
          subprocess.run(['docker','exec','-u','0',ids[0],'python3','-c',code],check=True)
          pub='-----BEGIN PUBLIC KEY-----\nMIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAu4v+j3g1ncefSMMmEKoJ\nwBQTtw9l0WKCNl9KXfhZCGoetYegf50v2B00rCCU+UZgp/HnLhJiNSRoPKOe9x6c\n0ZAOyfJ57OQF7pTt4UwVbG5E78VtYqOsZ5YlANB4MMcvjLT3Nz8zAHvsM7EIFzCq\nXnFlf0hlJi9njpfPxEbtTiKUWEbAu/b9TOuKsVkpB4236AIrLApq52LtIhlD124c\nLkmQBgb5XXrPhPHsRFnva4gPcGC2KyBxf0SBzkwQolUmjRP+TK2XX4Iypdo4i/ja\n88pWeKHogq+rSYxgSwFd0wjoiSyk+3yuqBN38Sfty677VOITTxnAVunnKSff6Flj\nJQIDAQAB\n-----END PUBLIC KEY-----\n'
          with tempfile.NamedTemporaryFile(mode='w') as key:
              key.write(pub);key.flush()
              for name in ('upgrade.private.log','candidate-prepare.private.log','activity.private.json','run_regression.py.private.log'):
                  payload=gzip.compress((root/name).read_bytes()[-24000:])
                  blocks=[subprocess.check_output(['openssl','pkeyutl','-encrypt','-pubin','-inkey',key.name,'-pkeyopt','rsa_padding_mode:oaep','-pkeyopt','rsa_oaep_md:sha256'],input=payload[i:i+190]).hex().translate(str.maketrans('0123456789abcdef','ABCDEFGHIJKLMNOP')) for i in range(0,len(payload),190)]
                  print('ENCRYPTED_DIAGNOSTIC='+json.dumps({'name':name,'blocks':blocks}))
          PY
