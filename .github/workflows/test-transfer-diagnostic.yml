name: Inspect restricted TEST transfer connection
on:
  push:
    branches: [main]
    paths: [.github/workflows/test-transfer-diagnostic.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read restricted transfer eligibility only
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" sudo -n python3 - <<'PY'
          import os,pwd,json,subprocess,hashlib,base64,stat
          from pathlib import Path
          user=pwd.getpwuid(int(os.environ['SUDO_UID']))
          root=Path('/var/lib/docker/volumes/autochapeau_staging_odoo_odoo-data/_data/test-refresh-backups/production-copy-44510251918')
          keys=Path(user.pw_dir)/'.ssh/authorized_keys'
          line=next(line for line in keys.read_text().splitlines() if 'test-refresh-44510251918' in line)
          key=line.split('ssh-ed25519 ')[1].split()[0]
          print('TASK_TRANSFER_KEY_FINGERPRINT=SHA256:'+base64.b64encode(hashlib.sha256(base64.b64decode(key)).digest()).decode().rstrip('='))
          result=subprocess.run(['sudo','-u',user.pw_name,'sudo','-n','/usr/bin/python3',str(root/'receive.py'),'ready'],capture_output=True,text=True)
          print('DEPLOYMENT_RECEIVER_COMMAND_CHECK='+json.dumps({'returncode':result.returncode,'stdout':result.stdout[-200:],'stderr':result.stderr.replace(user.pw_name,'[deployment-user]')[-500:]}))
          settings=subprocess.check_output(['/usr/sbin/sshd','-T','-C','user='+user.pw_name+',host=localhost,addr=127.0.0.1'],text=True)
          print('\n'.join(line.replace(user.pw_name,'[deployment-user]') for line in settings.splitlines() if line.startswith(('authorizedkeysfile ','authorizedkeyscommand ','authenticationmethods ','usepam '))))
          print('TRANSFER_KEY_PERMISSIONS='+json.dumps({'home':oct(stat.S_IMODE(Path(user.pw_dir).stat().st_mode)),'ssh':oct(stat.S_IMODE(keys.parent.stat().st_mode)),'keys':oct(stat.S_IMODE(keys.stat().st_mode)),'owner_matches':keys.stat().st_uid==user.pw_uid}))
          journal=subprocess.run(['journalctl','-u','ssh','--since=-4min','--no-pager'],capture_output=True,text=True)
          lines=[line.replace(user.pw_name,'[deployment-user]') for line in journal.stdout.splitlines() if user.pw_name in line and 'uHgYIJK' not in line and 'session opened' not in line and 'session closed' not in line]
          print('\n'.join(lines[-12:]))
          PY
