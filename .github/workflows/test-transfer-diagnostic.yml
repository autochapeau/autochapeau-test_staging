name: Inspect restricted TEST transfer connection
on:
  push:
    branches: [main]
    paths: [.github/workflows/test-transfer-diagnostic.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read restricted transfer eligibility only
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" sudo -n python3 - <<'PY'
          import json,shutil,re,subprocess,tempfile,base64,gzip
          from pathlib import Path
          root=Path('/var/lib/docker/volumes/autochapeau_staging_odoo_odoo-data/_data/test-refresh-backups/production-copy-44512412979')
          files=list((root/'incoming').rglob('*'))
          regular=[p for p in files if p.is_file()]
          result={'received_complete':(root/'received.json').exists(),'candidate_verified':(root/'candidate-verified.json').exists(),'completed':(root/'completed.json').exists(),'received_file_count':len(regular),'received_bytes':sum(p.stat().st_size for p in regular),'free_bytes':shutil.disk_usage(root).free,'stage_logs':{p.name:p.stat().st_size for p in root.glob('*.log')}}
          print('TEST_REFRESH_PROGRESS='+json.dumps(result,sort_keys=True))
          for filename in ('candidate-prepare.private.log','restore.private.log','native-neutralize.private.log','upgrade.private.log','verify_staging.py.private.log','run_regression.py.private.log','run_mobile_unique_tests.py.private.log'):
              path=root/filename
              if not path.exists():continue
              selected=[]
              for line in path.read_text(errors='replace').splitlines()[-150:]:
                  text=line.strip()
                  if text.startswith(('Traceback','File ','AssertionError','ValueError','KeyError','TypeError','FileNotFoundError','RuntimeError','odoo.tools.convert.ParseError','Error while validating view','Field ' ,'psycopg2.')) or ('psql:' in line and 'ERROR:' in line):
                      if text.startswith('Field '):print('STATIC_VIEW_FIELD_NAMES='+json.dumps(re.findall(r'["\x27]([a-zA-Z0-9_.]+)["\x27]',text)))
                      text=re.sub(r"(['\"])(.*?)\1",'<redacted>',text)
                      text=re.sub(r'[A-Za-z0-9_.+-]+@[A-Za-z0-9.-]+','<redacted>',text)
                      selected.append(text[:600])
              if selected:print('TEST_REFRESH_ERROR_CONTEXT='+json.dumps({'log':filename,'lines':selected[-14:]}))

          pub='-----BEGIN PUBLIC KEY-----\nMIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAu4v+j3g1ncefSMMmEKoJ\nwBQTtw9l0WKCNl9KXfhZCGoetYegf50v2B00rCCU+UZgp/HnLhJiNSRoPKOe9x6c\n0ZAOyfJ57OQF7pTt4UwVbG5E78VtYqOsZ5YlANB4MMcvjLT3Nz8zAHvsM7EIFzCq\nXnFlf0hlJi9njpfPxEbtTiKUWEbAu/b9TOuKsVkpB4236AIrLApq52LtIhlD124c\nLkmQBgb5XXrPhPHsRFnva4gPcGC2KyBxf0SBzkwQolUmjRP+TK2XX4Iypdo4i/ja\n88pWeKHogq+rSYxgSwFd0wjoiSyk+3yuqBN38Sfty677VOITTxnAVunnKSff6Flj\nJQIDAQAB\n-----END PUBLIC KEY-----\n'
          with tempfile.NamedTemporaryFile(mode='w') as key:
              key.write(pub);key.flush()
              for name in ('upgrade.private.log','candidate-prepare.private.log'):
                  payload=gzip.compress((root/name).read_bytes()[-24000:])
                  blocks=[base64.b64encode(subprocess.check_output(['openssl','pkeyutl','-encrypt','-pubin','-inkey',key.name,'-pkeyopt','rsa_padding_mode:oaep','-pkeyopt','rsa_oaep_md:sha256'],input=payload[i:i+190])).decode() for i in range(0,len(payload),190)]
                  print('ENCRYPTED_DIAGNOSTIC='+json.dumps({'name':name,'blocks':blocks}))
          PY
