name: Inspect restricted TEST transfer connection
on:
  push:
    branches: [main]
    paths: [.github/workflows/test-transfer-diagnostic.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read restricted transfer eligibility only
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" sudo -n python3 - <<'PY'
          import json,subprocess
          ids=subprocess.check_output(['docker','ps','--filter','label=com.docker.swarm.service.name=autochapeau_staging_odoo_odoo','--format','{{.ID}}'],text=True).split();assert len(ids)==1
          code=r"""
          import json,psycopg2
          from odoo.tools import config
          config.parse_config([])
          options={k:config['db_'+k] for k in ('host','port','user','password') if config['db_'+k]}
          with psycopg2.connect(dbname='autochapeau_prod_test',**options) as old,psycopg2.connect(dbname='test_refresh_candidate_44512412979',**options) as new:
              old.set_session(readonly=True);new.set_session(readonly=True)
              a=old.cursor();b=new.cursor()
              a.execute("SELECT res_id FROM ir_model_data WHERE module='base' AND name='group_system' AND model='res.groups'");system=a.fetchone()[0]
              a.execute('SELECT DISTINCT u.id,u.login FROM res_users_apikeys a JOIN res_users u ON u.id=a.user_id');users=a.fetchall()
              missing=[];matching=0
              for uid,login in users:
                  b.execute('SELECT id FROM res_users WHERE login=%s AND active',[login])
                  if b.fetchone():matching+=1;continue
                  a.execute('SELECT 1 FROM res_groups_users_rel WHERE uid=%s AND gid=%s',[uid,system])
                  missing.append({'was_test_administrator':uid==1 or bool(a.fetchone())})
              b.execute("SELECT u.active FROM res_users u JOIN ir_model_data d ON d.res_id=u.id AND d.model='res.users' WHERE d.module='base' AND d.name='user_admin'")
              admin=b.fetchone()
              print('TEST_API_IDENTITY_COMPATIBILITY='+json.dumps({'identities':len(users),'matching':matching,'missing':missing,'production_administrator_active':bool(admin and admin[0])}))
          """
          subprocess.run(['docker','exec',ids[0],'python3','-c',code],check=True)
          PY
