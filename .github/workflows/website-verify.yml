name: Verify website requirements on TEST
on:
  push:
    branches: [codex/website-test-release]
    paths:
      - .github/verification/addon_tests/portal_api/test_website_release.py
      - .github/verification/run_website_tests.py
      - .github/workflows/website-verify.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: website-test-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for matching TEST backend deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,subprocess,time,urllib.request
          expected={name:subprocess.check_output(['git','rev-parse','HEAD:'+name],text=True).strip()
                    for name in ('portal_api','portal_content')}
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/workflows/deploy.yml/runs?branch=main&per_page=1'
          previous=None
          for attempt in range(60):
              request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=30) as response:
                  run=json.load(response)['workflow_runs'][0]
              state=(run['id'],run['status'],run['conclusion'])
              if state != previous:
                  print('TEST backend deployment state:',state,flush=True); previous=state
              if run['status']=='completed' and run['conclusion']=='success':
                  subprocess.run(['git','fetch','--quiet','--depth=1','origin',run['head_sha']],check=True)
                  deployed={name:subprocess.check_output(['git','rev-parse','FETCH_HEAD:'+name],text=True).strip() for name in expected}
                  if deployed==expected:
                      print('Matching TEST backend is deployed',flush=True)
                      break
              time.sleep(10)
          else:
              raise RuntimeError('Deploy the matching backend to TEST before running website acceptance tests')
          PY
      - name: Run rollback-only website tests on TEST
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          REMOTE_DIR="/tmp/website-verification-$GITHUB_RUN_ID"
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "mkdir -p '$REMOTE_DIR'"
          scp -P "$SSH_PORT" .github/verification/run_website_tests.py .github/verification/addon_tests/portal_api/test_website_release.py "$SSH_USER@$SSH_HOST:$REMOTE_DIR/"
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "bash -s '$REMOTE_DIR'" <<'REMOTE'
          set -euo pipefail
          ROOT="$1"
          CONTAINER=$(sudo docker ps --filter name=autochapeau_staging_odoo_odoo --format '{{.ID}}' | head -1)
          test -n "$CONTAINER"
          sudo docker cp "$ROOT" "$CONTAINER:$ROOT"
          sudo docker exec -i -e WEBSITE_VERIFICATION_ROOT="$ROOT" "$CONTAINER" odoo shell -d autochapeau_prod_test --no-http --max-cron-threads=0 < "$ROOT/run_website_tests.py"
          REMOTE
