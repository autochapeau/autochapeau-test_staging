name: Deploy and verify workshop preparation and material issue on TEST

on:
  push:
    branches: [codex/workshop-material-issue-test]
    paths:
      - .github/workflows/workshop-material-issue-test.yml
      - .github/verification/workshop_issue_acceptance.py

permissions:
  contents: read

concurrency:
  group: odoo-test-deployment
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify the already-upgraded TEST database without downtime
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/workshop_test_key
          for attempt in 1 2 3; do
            if ssh-keyscan -T 8 -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts; then break; fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          release_sha=$(git rev-list -1 HEAD -- workorder_service_components)
          remote_result=$(mktemp)
          ssh -o BatchMode=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            -i ~/.ssh/workshop_test_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "bash -s -- $release_sha $GITHUB_SHA" <<'REMOTE' | tee "$remote_result"
          set -euo pipefail
          umask 077
          release_sha=$1
          verification_sha=$2
          project=/home/admin/custom_addons
          service=autochapeau_staging_odoo_odoo
          database=autochapeau_prod_test
          cd "$project"
          exec 9>"$(git rev-parse --git-path workshop-material-issue-release.lock)"
          flock -w 120 9
          test "$(git rev-parse HEAD)" = "$release_sha"
          git fetch --no-tags https://github.com/autochapeau/autochapeau-test_staging.git codex/workshop-material-issue-test
          test "$(git rev-parse FETCH_HEAD)" = "$verification_sha"
          container=$(sudo -n docker ps --filter "label=com.docker.swarm.service.name=$service" --format '{{.ID}}' | head -1)
          test -n "$container"
          git show "$verification_sha:.github/verification/workshop_issue_acceptance.py" | sudo -n docker exec -i "$container" odoo shell -d "$database" --no-http --max-cron-threads=0
          sudo -n docker exec "$container" python3 -c "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8069/web/health', timeout=5).status == 200"
          echo TEST_WORKSHOP_ISSUE_HTTP_OK=true
          REMOTE
          grep -qx 'TEST_WORKSHOP_ISSUE_HTTP_OK=true' "$remote_result"
          grep -q '^TEST_WORKSHOP_ISSUE_REGRESSION=' "$remote_result"
