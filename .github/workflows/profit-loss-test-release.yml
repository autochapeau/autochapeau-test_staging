name: Deploy Profit and Loss on TEST

on:
  push:
    branches: [codex/profit-loss-test-release]
    paths:
      - .github/workflows/profit-loss-test-release.yml

permissions:
  contents: read

concurrency:
  group: odoo-test-deployment
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Back up TEST, upgrade Profit and Loss offline, and verify
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/workshop_test_key
          for attempt in 1 2 3; do
            if ssh-keyscan -T 8 -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts; then break; fi
            sleep 3
          done
          test -s ~/.ssh/known_hosts
          release_sha=$(git rev-list -1 HEAD -- account_balance_sheet_report)
          remote_result=$(mktemp)
          ssh -o BatchMode=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            -i ~/.ssh/workshop_test_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "bash -s -- $release_sha $GITHUB_SHA" <<'REMOTE' | tee "$remote_result"
          set -euo pipefail
          umask 077
          release_sha=$1
          verification_sha=$2
          project=/home/admin/custom_addons
          service=autochapeau_staging_odoo_odoo
          database=autochapeau_prod_test
          cd "$project"
          exec 9>"$(git rev-parse --git-path profit-loss-release.lock)"
          flock -w 120 9
          git diff --cached --quiet
          git fetch --no-tags https://github.com/autochapeau/autochapeau-test_staging.git main
          test "$(git rev-parse FETCH_HEAD)" = "$release_sha"
          git fetch --no-tags https://github.com/autochapeau/autochapeau-test_staging.git codex/profit-loss-test-release
          test "$(git rev-parse FETCH_HEAD)" = "$verification_sha"
          git merge-base --is-ancestor "$release_sha" "$verification_sha"
          git diff --quiet HEAD "$release_sha" -- . ':(exclude)account_balance_sheet_report' ':(exclude).github/**'
          container=$(sudo -n docker ps --filter "label=com.docker.swarm.service.name=$service" --format '{{.ID}}' | head -1)
          test -n "$container"
          source_paths=(. ':(exclude)**/__pycache__/**' ':(exclude)**/*.pyc')
          original_changes=$(git diff --binary -- "${source_paths[@]}" | sha256sum)
          git diff --binary -- "${source_paths[@]}" > "$(git rev-parse --git-path "test-before-profit-losss-$(date -u +%Y%m%dT%H%M%SZ).patch")"
          scratch=$(mktemp -d)
          trap 'rm -rf -- "$scratch"' EXIT
          mkdir "$scratch/scripts" "$scratch/verification"
          git show "$release_sha:.github/scripts/odoo_maintenance.py" > "$scratch/scripts/odoo_maintenance.py"
          git show "$release_sha:.github/scripts/production_release_check.py" > "$scratch/scripts/production_release_check.py"
          cat > "$scratch/verification/verify_staging.py" <<'PY'
          from lxml import etree
          from odoo.modules.module import get_manifest

          assert env.cr.dbname == "autochapeau_prod_test"
          result = {}
          for addon in ("account_deferred_revenue", "partner_management"):
              module = env["ir.module.module"].search([("name", "=", addon)], limit=1)
              assert module.state == "installed" and module.latest_version == get_manifest(addon)["version"]
          PY
          git show "$release_sha:.github/verification/verify_staging.py" |
            sed -n '/^journal_action = /,/^result\["service_advance_product_labels"\] = True$/p' >> "$scratch/verification/verify_staging.py"
          cat >> "$scratch/verification/verify_staging.py" <<'PY'
          assert result["journal_items_columns"] and result["service_advance_product_labels"]
          print("TEST_JOURNAL_ADVANCE_STILL_OK=true", flush=True)
          PY
          git show "$release_sha:.github/verification/profit_loss_release_checks.py" >> "$scratch/verification/verify_staging.py"
          # The generic helper appends an extra TEST acceptance file. Keep this release scoped to workshops.
          touch "$scratch/verification/commission_period_release_checks.py"
          (umask 022; git merge --ff-only "$release_sha")
          mapfile -d '' -t published_files < <(git diff-tree --no-commit-id -r --name-only -z --diff-filter=ACMRT \
            "$release_sha" -- account_balance_sheet_report)
          test "${#published_files[@]}" -gt 0
          for source in "${published_files[@]}"; do
            test -f "$source" && test ! -L "$source"
            chmod a+r -- "$source"
            dir=$(dirname -- "$source")
            while [ "$dir" != "." ]; do
              chmod a+rx -- "$dir"
              dir=$(dirname -- "$dir")
            done
          done
          sudo -n docker exec "$container" python3 -c '
          import sys
          from pathlib import Path
          for name in sys.argv[1:]:
              with (Path("/mnt/extra-addons") / name).open("rb") as source:
                  source.read(1)
          ' "${published_files[@]}"
          echo TEST_RELEASE_FILES_READABLE=true
          test "$original_changes" = "$(git diff --binary -- "${source_paths[@]}" | sha256sum)"
          echo TEST_LOCAL_SOURCE_CHANGES_PRESERVED=true
          sudo -n python3 "$scratch/scripts/odoo_maintenance.py" \
            --service "$service" --database "$database" \
            --modules account_balance_sheet_report --release-check \
            --state-file "$project/$(git rev-parse --git-path profit-loss-maintenance.json)" </dev/null
          for attempt in $(seq 1 40); do
            container=$(sudo -n docker ps --filter "label=com.docker.swarm.service.name=$service" --format '{{.ID}}' | head -1)
            if [ -n "$container" ] && sudo -n docker exec "$container" python3 -c \
              "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8069/web/health', timeout=5).status == 200"; then
              echo TEST_PROFIT_LOSS_HTTP_OK=true
              exit 0
            fi
            sleep 3
          done
          exit 1
          REMOTE
          grep -qx 'TEST_PROFIT_LOSS_HTTP_OK=true' "$remote_result"
