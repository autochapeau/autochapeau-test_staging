name: Deploy Odoo Modules

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy changed modules
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

        run: |
          set -e

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE_SCRIPT'
          set -e

          PROJECT_PATH="/home/admin/custom_addons"
          # The database exposed by erp-test.autochapeau.com/database/selector.
          ODOO_DATABASE="autochapeau_prod_test"
          ODOO_SERVICE="autochapeau_staging_odoo_odoo"
          ODOO_CONTAINER_NAME="autochapeau_staging_odoo_odoo"
          REQUIRED_FEATURE_MODULES="account_asset_management,appointment_management,partner_management,sale_split_payment,account_deferred_revenue,sales_region_commission,account_move_print,commission"

          cd "$PROJECT_PATH"

          OLD_COMMIT=$(git rev-parse HEAD)

          git pull --ff-only https://github.com/autochapeau/autochapeau-test_staging.git main

          NEW_COMMIT=$(git rev-parse HEAD)

          if [ "$OLD_COMMIT" = "$NEW_COMMIT" ]; then
            echo "No new source changes; checking required feature modules and verification."
          fi

          MODULES=$(
            git diff --name-only "$OLD_COMMIT" "$NEW_COMMIT" |
            awk -F/ '{print $1}' |
            sort -u |
            while read -r module; do
              if [ -f "$module/__manifest__.py" ]; then
                echo "$module"
              fi
            done |
            paste -sd, -
          )

          if [ -z "$MODULES" ]; then
            MODULES="$REQUIRED_FEATURE_MODULES"
          fi

          echo "Changed modules: $MODULES"

          ODOO_CONTAINER=$(
            sudo docker ps \
              --filter "name=$ODOO_CONTAINER_NAME" \
              --format '{{.ID}}' |
              head -1
          )

          if [ -z "$ODOO_CONTAINER" ]; then
            echo "Odoo container not found."
            exit 1
          fi

          sudo docker exec -i "$ODOO_CONTAINER" \
            odoo shell -d "$ODOO_DATABASE" --no-http --max-cron-threads=0 \
            < "$PROJECT_PATH/.github/verification/repair_test_view_dependencies.py"

          INSTALL_MODULES=$(
            sudo docker exec -i \
              -e VIDEO_VERIFY_REQUIRED_MODULES="$REQUIRED_FEATURE_MODULES" \
              -e VIDEO_VERIFY_DATABASE="$ODOO_DATABASE" "$ODOO_CONTAINER" python3 - \
              < "$PROJECT_PATH/.github/verification/installation_plan.py"
          )
          INSTALL_ARGS=()
          if [ -n "$INSTALL_MODULES" ]; then
            INSTALL_ARGS=(-i "$INSTALL_MODULES")
            echo "Install missing feature addons: $INSTALL_MODULES"
          fi

          sudo docker exec "$ODOO_CONTAINER" \
            odoo \
            -d "$ODOO_DATABASE" \
            -u "$MODULES" \
            "${INSTALL_ARGS[@]}" \
            --stop-after-init \
            --http-port=8075 \
            --max-cron-threads=0

          sudo docker service update \
            --force \
            "$ODOO_SERVICE"

          # Verify the restarted TEST service using the freshly deployed code.
          ODOO_CONTAINER=$(
            sudo docker ps --filter "name=$ODOO_CONTAINER_NAME" --format '{{.ID}}' | head -1
          )
          test -n "$ODOO_CONTAINER"
          VERIFY_PATH="/tmp/video_requirements_verify_${NEW_COMMIT}"
          sudo docker exec "$ODOO_CONTAINER" mkdir -p "$VERIFY_PATH"
          sudo docker cp "$PROJECT_PATH/.github/verification/." "$ODOO_CONTAINER:$VERIFY_PATH/"
          sudo docker exec -i "$ODOO_CONTAINER" \
            odoo shell -d "$ODOO_DATABASE" --no-http --max-cron-threads=0 \
            < "$PROJECT_PATH/.github/verification/verify_staging.py"
          sudo docker exec -i -e VIDEO_VERIFICATION_ROOT="$VERIFY_PATH" "$ODOO_CONTAINER" \
            odoo shell -d "$ODOO_DATABASE" --no-http --max-cron-threads=0 \
            < "$PROJECT_PATH/.github/verification/run_regression.py"

          echo "Deployment completed successfully."
          REMOTE_SCRIPT
